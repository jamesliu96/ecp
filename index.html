<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <title>Encrypted Clipboard</title>
    <link rel="stylesheet" href="/main.css" />
  </head>
  <body>
    <div class="relative flex h-full min-h-0 w-full flex-1 overflow-hidden">
      <aside
        id="sidebar-view"
        class="view-transition z-20 flex h-full min-h-0 w-full shrink-0 flex-col border-r border-slate-800 bg-slate-900/90 transition-all duration-200 md:w-80"
      >
        <div
          class="shrink-0 border-b border-slate-800 bg-slate-900/95 p-5 pt-[max(1.25rem,env(safe-area-inset-top))]"
        >
          <div class="mb-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div
                class="h-2.5 w-2.5 rounded-full bg-emerald-400 shadow-xs shadow-emerald-500/50"
              ></div>
              <a
                class="text-base font-bold tracking-tight text-slate-100"
                href="https://github.com/jamesliu96/ecp"
                target="_blank"
                rel="noopener"
              >
                ECP Node
              </a>
            </div>
            <button
              id="btn-global-settings"
              class="flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-lg p-2 text-slate-400 transition-colors hover:bg-slate-800 hover:text-slate-100"
              aria-label="Global Settings"
            >
              <svg
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                ></path>
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                ></path>
              </svg>
            </button>
          </div>
          <div
            class="mb-1.5 text-[10px] font-bold tracking-widest text-slate-500 uppercase"
          >
            Local Identity Fingerprint
          </div>
          <div
            id="my-fingerprint"
            class="flex min-h-11 items-center rounded-lg border border-slate-800/80 bg-slate-950 p-3 font-mono text-[11px] break-all text-emerald-300 shadow-inner select-all"
          >
            Loading...
          </div>
          <button
            id="btn-copy-identity"
            class="mt-3.5 min-h-11 w-full cursor-pointer rounded-lg border border-slate-700/80 bg-slate-800 px-3 py-2.5 text-xs font-semibold text-slate-100 shadow-xs transition-all hover:bg-slate-700 active:scale-95"
          >
            Copy Identity Bundle
          </button>
        </div>

        <div
          class="min-h-0 flex-1 overflow-y-auto overscroll-y-contain bg-slate-900/40 p-4"
        >
          <div class="mb-3 flex items-center justify-between">
            <h2
              class="text-[11px] font-bold tracking-widest text-slate-500 uppercase"
            >
              Peers
            </h2>
            <button
              id="btn-toggle-archived"
              class="-mr-2 min-h-9 cursor-pointer px-2 text-[11px] font-medium text-slate-400 uppercase transition-colors hover:text-slate-200"
            >
              Show Archived
            </button>
          </div>
          <div id="contacts-list" class="space-y-2"></div>
        </div>

        <div
          class="shrink-0 border-t border-slate-800 bg-slate-900/95 p-4 pb-[max(1rem,env(safe-area-inset-bottom))]"
        >
          <button
            id="btn-read-clipboard"
            class="mb-2.5 min-h-11 w-full cursor-pointer rounded-lg border border-slate-700/80 bg-slate-800 px-4 py-2.5 text-sm font-semibold text-slate-100 shadow-xs transition-all hover:bg-slate-700 active:scale-95"
          >
            Read Clipboard Packet
          </button>
          <button
            id="btn-add-contact"
            class="min-h-11 w-full cursor-pointer rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-xs transition-all hover:bg-indigo-500 active:scale-95"
          >
            + Link New Peer
          </button>
        </div>
      </aside>

      <main
        id="chat-view"
        class="view-transition relative z-10 hidden h-full min-h-0 w-full flex-1 flex-col bg-slate-950 md:flex"
      >
        <header
          class="flex min-h-16 shrink-0 items-center justify-between border-b border-slate-800 bg-slate-900/90 px-4 py-3 pt-[max(0.75rem,env(safe-area-inset-top))]"
        >
          <div class="flex w-full max-w-[60%] items-center gap-3">
            <button
              id="btn-back-mobile"
              class="-ml-2 flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-lg p-2 text-slate-400 hover:text-white md:hidden"
              aria-label="Back to Sidebar"
            >
              <svg
                class="h-6 w-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 19l-7-7 7-7"
                ></path>
              </svg>
            </button>
            <div class="truncate">
              <h2
                id="chat-title"
                class="truncate text-base font-bold text-slate-100"
              >
                Select a Peer
              </h2>
              <div
                class="mt-0.5 flex items-center gap-2 text-[11px] font-medium text-slate-400"
              >
                <span
                  id="chat-status-dot"
                  class="h-2 w-2 rounded-full bg-slate-500"
                ></span>
                <span id="chat-status-text">Idle</span>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-1.5">
            <button
              id="btn-search-toggle"
              class="flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-lg p-2 text-slate-400 transition-colors hover:bg-slate-800 hover:text-white"
              aria-label="Toggle Search"
            >
              <svg
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </button>
            <div class="relative">
              <button
                id="btn-peer-menu"
                class="flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-lg p-2 text-slate-400 transition-colors hover:bg-slate-800 hover:text-white"
                aria-label="Peer Options Menu"
              >
                <svg
                  class="h-5 w-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"
                  ></path>
                </svg>
              </button>
              <div
                id="peer-dropdown"
                class="absolute right-0 z-50 mt-2 hidden w-52 divide-y divide-slate-800/80 rounded-xl border border-slate-800 bg-slate-900 py-1 shadow-2xl"
              >
                <div class="py-1">
                  <button
                    id="btn-rename-contact"
                    class="min-h-11 w-full cursor-pointer px-4 py-2.5 text-left text-xs font-medium text-slate-300 hover:bg-slate-800"
                  >
                    Rename Alias
                  </button>
                  <button
                    id="btn-archive-contact"
                    class="min-h-11 w-full cursor-pointer px-4 py-2.5 text-left text-xs font-medium text-slate-300 hover:bg-slate-800"
                  >
                    Archive Peer
                  </button>
                </div>
                <div class="py-1">
                  <button
                    id="btn-reset-session"
                    class="min-h-11 w-full cursor-pointer px-4 py-2.5 text-left text-xs font-medium text-amber-400 hover:bg-slate-800"
                  >
                    Wipe Channel State
                  </button>
                  <button
                    id="btn-delete-contact"
                    class="min-h-11 w-full cursor-pointer px-4 py-2.5 text-left text-xs font-medium text-red-400 hover:bg-slate-800"
                  >
                    Delete Peer & History
                  </button>
                </div>
              </div>
            </div>
          </div>
        </header>

        <div
          id="search-bar-container"
          class="hidden shrink-0 border-b border-slate-800 bg-slate-900 p-2.5 px-4"
        >
          <input
            type="text"
            id="chat-search-input"
            class="min-h-11 w-full rounded-lg border border-slate-700/80 bg-slate-950 px-3.5 py-2 text-base text-slate-200 focus:border-indigo-500 focus:outline-none sm:text-sm"
            placeholder="Search local history..."
          />
        </div>

        <div
          id="chat-messages"
          class="relative flex min-h-0 flex-1 flex-col gap-y-3.5 overflow-y-auto overscroll-y-contain p-4 pb-6 select-text"
        ></div>

        <div
          id="empty-state"
          class="absolute inset-0 top-16 z-0 flex flex-col items-center justify-center bg-slate-950 px-6 text-center"
        >
          <div
            class="mb-5 flex h-16 w-16 items-center justify-center rounded-2xl border border-slate-800/80 bg-slate-900 shadow-inner"
          >
            <svg
              class="h-8 w-8 text-slate-600"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
              ></path>
            </svg>
          </div>
          <h3 class="mb-1 text-base font-semibold text-slate-200">
            Terminal Idle
          </h3>
          <p class="mb-6 max-w-sm text-xs text-slate-500">
            Select a trusted peer to begin secure post-quantum communication.
          </p>
        </div>

        <div
          id="chat-input-area"
          class="relative hidden shrink-0 border-t border-slate-800 bg-slate-900/90 p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]"
        >
          <form
            id="chat-form"
            class="flex min-w-0 flex-row flex-nowrap items-center gap-1.5 sm:gap-2"
          >
            <button
              type="button"
              id="btn-attach"
              class="flex min-h-11 shrink-0 cursor-pointer items-center justify-center rounded-lg border border-slate-700/80 bg-slate-800 px-2.5 text-slate-400 transition-colors hover:bg-slate-700 hover:text-emerald-400 disabled:cursor-not-allowed disabled:opacity-50 sm:px-3"
              aria-label="Attach Media"
            >
              <svg
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"
                ></path>
              </svg>
            </button>
            <input
              type="file"
              id="media-input"
              class="hidden"
              accept="image/*,video/*,audio/*"
            />
            <input
              type="text"
              id="chat-input"
              class="min-h-11 min-w-0 flex-1 rounded-lg border border-slate-700/80 bg-slate-950 px-3 py-2 text-base text-slate-200 transition-colors focus:border-emerald-500 focus:outline-none sm:px-4 sm:text-sm"
              placeholder="Type message..."
              autocomplete="off"
              enterkeyhint="send"
            />
            <button
              type="button"
              id="btn-read"
              class="min-h-11 shrink-0 cursor-pointer rounded-lg border border-slate-700/80 bg-slate-800 px-3 py-2 text-xs font-semibold text-slate-200 transition-all hover:bg-slate-700 active:scale-95 sm:px-4 md:px-5"
            >
              Read
            </button>
            <button
              type="submit"
              class="min-h-11 shrink-0 cursor-pointer rounded-lg bg-emerald-600 px-3.5 py-2 text-xs font-semibold text-white shadow-xs transition-all hover:bg-emerald-500 active:scale-95 disabled:cursor-not-allowed disabled:opacity-50 sm:px-5 md:px-6"
            >
              Send
            </button>
          </form>
        </div>
      </main>
    </div>

    <div
      id="toast"
      role="status"
      aria-live="polite"
      class="pointer-events-none fixed top-[max(1rem,env(safe-area-inset-top))] left-1/2 z-100 flex min-h-11 -translate-x-1/2 items-center gap-2 rounded-xl border border-slate-700 bg-slate-800 px-4 py-2.5 text-xs font-semibold text-slate-100 opacity-0 shadow-2xl transition-all duration-300"
    >
      <span id="toast-msg"></span>
    </div>

    <div
      id="modal-overlay"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 p-4 backdrop-blur-xs transition-opacity"
    >
      <div
        id="modal-container"
        class="flex max-h-[90dvh] w-full max-w-sm flex-col overflow-y-auto rounded-2xl border border-slate-800 bg-slate-900 shadow-2xl"
        onclick="event.stopPropagation()"
      ></div>
    </div>

    <div
      id="metadata-overlay"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 p-4 backdrop-blur-xs transition-opacity"
    >
      <div
        class="flex max-h-[90dvh] w-full max-w-md flex-col rounded-2xl border border-slate-800 bg-slate-900 shadow-2xl"
        onclick="event.stopPropagation()"
      >
        <div
          class="flex shrink-0 items-center justify-between rounded-t-2xl border-b border-slate-800 bg-slate-800/80 px-4 py-3"
        >
          <h3
            id="metadata-title"
            class="text-xs font-bold tracking-widest text-slate-300 uppercase"
          >
            Inspector
          </h3>
          <button
            id="btn-close-metadata"
            class="-mr-2 flex min-h-11 min-w-11 cursor-pointer items-center justify-center p-2 text-slate-400 hover:text-slate-200"
            aria-label="Close Metadata"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
        <div
          class="space-y-2.5 overflow-y-auto p-4 font-mono text-[11px] leading-relaxed text-slate-300"
          id="metadata-content"
        ></div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@noble/ciphers/": "/vendor/@noble/ciphers/",
          "@noble/curves/": "/vendor/@noble/curves/",
          "@noble/hashes/": "/vendor/@noble/hashes/",
          "@noble/post-quantum/": "/vendor/@noble/post-quantum/"
        }
      }
    </script>
    <script type="module" src="/main.js"></script>
    <script>
      addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('/sw.js');
          console.info('[ServiceWorker] Registration complete.');

          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            if (!newWorker) return;

            newWorker.addEventListener('statechange', () => {
              if (
                newWorker.state === 'installed' &&
                navigator.serviceWorker.controller
              ) {
                console.info('[ServiceWorker] New version available.');
                window.__showToast?.('Update Available');
              }
            });
          });

          setInterval(() => {
            registration.update();
          }, 60000);
        } catch (err) {
          console.error('[ServiceWorker] Registration failed:', err);
        }
      });
    </script>
  </body>
</html>
